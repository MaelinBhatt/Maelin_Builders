<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b2d" />
    <title>Typewell — Typing Speed Test</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap");

      :root { --ink:#eaf1ff; --muted:#91a0ba; --canvas:#0b1322; --card:#121e32cc; --line:#2a3b57; --blue:#72a8ff; --mint:#69e3b1; --coral:#ff8d94; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; color:var(--ink); font-family:Manrope, sans-serif; background:var(--canvas); }
      body::before, body::after { content:""; position:fixed; z-index:-1; border-radius:50%; filter:blur(1px); opacity:.7; }
      body::before { width:39rem; height:39rem; top:-24rem; left:-13rem; background:radial-gradient(circle, #245795 0%, transparent 68%); }
      body::after { width:34rem; height:34rem; right:-16rem; bottom:-20rem; background:radial-gradient(circle, #155c5a 0%, transparent 69%); }
      .shell { width:min(100% - 2rem, 980px); margin:auto; padding:clamp(1.5rem, 5vw, 4.5rem) 0 2rem; }
      header { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:clamp(2rem, 5vw, 4.25rem); }
      .brand { display:flex; gap:.7rem; align-items:center; font-size:1.1rem; font-weight:800; letter-spacing:-.05em; }
      .brand-mark { width:2rem; height:2rem; display:grid; place-items:center; color:#0a1525; border-radius:9px; background:linear-gradient(135deg, #94c4ff, #68e8bb); font-family:"DM Mono",monospace; font-size:.9rem; }
      .header-note { color:var(--muted); font-size:.78rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
      .hero { max-width:650px; margin-bottom:2.25rem; }
      .eyebrow { margin:0 0 .7rem; color:var(--mint); font-size:.75rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
      h1 { margin:0; font-size:clamp(2.2rem, 6vw, 4.5rem); line-height:1.04; letter-spacing:-.065em; }
      .intro { max-width:565px; margin:1rem 0 0; color:var(--muted); font-size:clamp(.94rem, 2vw, 1.05rem); line-height:1.7; }
      .test-card { padding:clamp(1.1rem, 3vw, 2rem); border:1px solid #334864; border-radius:24px; background:linear-gradient(145deg, #17263dce, #101c30d9); box-shadow:0 25px 65px #02091470; backdrop-filter:blur(16px); }
      .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; margin-bottom:1.5rem; }
      .stat { min-width:0; padding:.85rem .95rem; border:1px solid #2b3e5a; border-radius:13px; background:#0b1729a6; }
      .stat-label { display:block; color:var(--muted); font-size:.67rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
      .stat-value { display:block; margin-top:.28rem; font-family:"DM Mono",monospace; font-size:1.25rem; font-weight:500; }
      .passage-label { display:flex; align-items:center; justify-content:space-between; margin-bottom:.7rem; color:var(--muted); font-size:.73rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
      .passage { min-height:130px; padding:1.1rem 1.2rem; border:1px solid #2b3e5a; border-radius:15px; color:#6f829e; background:#091525a8; font-family:"DM Mono",monospace; font-size:clamp(.92rem, 2vw, 1.08rem); line-height:1.9; letter-spacing:.01em; transition:border-color .25s, box-shadow .25s; }
      .passage:focus-within { border-color:#5e96ed; box-shadow:0 0 0 4px #6598e820; }
      .passage span { border-radius:3px; transition:color .12s, background .12s; }
      .passage .correct { color:#e5f3ff; }
      .passage .incorrect { color:#ff9ca3; background:#ff697426; text-decoration:underline; text-decoration-color:#ff8590; text-underline-offset:3px; }
      .passage .current { color:#fff; background:#6097ef47; animation:caret .85s ease-in-out infinite alternate; }
      @keyframes caret { to { background:#6097ef15; } }
      .input-wrap { margin-top:1rem; }
      textarea { width:100%; min-height:105px; resize:vertical; padding:1rem 1.1rem; border:1px solid #415977; border-radius:15px; outline:0; color:var(--ink); background:#0b1728; font:400 .95rem/1.65 "DM Mono",monospace; transition:border-color .2s, box-shadow .2s, transform .2s; }
      textarea::placeholder { color:#62738e; }
      textarea:focus { border-color:var(--blue); box-shadow:0 0 0 4px #72a8ff24; }
      textarea:disabled { opacity:.65; cursor:default; }
      .footer-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-top:1rem; }
      .hint { margin:0; color:var(--muted); font-size:.78rem; line-height:1.45; }
      button { display:inline-flex; align-items:center; justify-content:center; gap:.45rem; padding:.76rem 1rem; border:1px solid #5c9dfd; border-radius:11px; cursor:pointer; color:#081426; background:linear-gradient(135deg, #9bc5ff, #70dcb7); font:800 .78rem/1 Manrope,sans-serif; letter-spacing:.02em; transition:transform .18s, box-shadow .18s, filter .18s; }
      button:hover { filter:brightness(1.08); box-shadow:0 8px 22px #68a9fc45; transform:translateY(-2px); }
      button:active { transform:translateY(0); }
      button svg { width:15px; }
      .result { display:none; margin-top:1.25rem; padding:1.15rem; border:1px solid #43b99072; border-radius:15px; background:#12362f8c; animation:rise .35s ease-out; }
      .result.show { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
      .result strong { display:block; color:#a5f5d4; font-size:.95rem; }
      .result span { display:block; margin-top:.2rem; color:#b6d9ca; font-size:.8rem; }
      @keyframes rise { from { opacity:0; transform:translateY(8px); } }
      @media (max-width:560px) { .shell { width:min(100% - 1.25rem, 980px); } header { margin-bottom:2.7rem; } .header-note { display:none; } .test-card { border-radius:19px; } .stats { gap:.45rem; } .stat { padding:.7rem .65rem; } .stat-value { font-size:1.05rem; } .passage { min-height:155px; padding:.9rem; line-height:1.8; } .footer-row { align-items:flex-start; flex-direction:column; } button { width:100%; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header><div class="brand"><span class="brand-mark">T.</span>typewell</div><span class="header-note">Find your flow</span></header>
      <section class="hero"><p class="eyebrow">A focused typing practice</p><h1>Make every word count.</h1><p class="intro">Settle in, type naturally, and watch your speed sharpen. Your timer starts with the first keystroke.</p></section>
      <section class="test-card" aria-label="Typing speed test">
        <div class="stats" aria-live="polite"><div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="time">0:00</span></div><div class="stat"><span class="stat-label">Speed</span><span class="stat-value" id="wpm">0 WPM</span></div><div class="stat"><span class="stat-label">Accuracy</span><span class="stat-value" id="accuracy">100%</span></div></div>
        <div class="passage-label"><span>Your passage</span><span id="word-count"></span></div>
        <div class="passage" id="passage" aria-label="Passage to type"></div>
        <div class="input-wrap"><textarea id="typing-input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Start typing here…" aria-label="Type the passage here"></textarea></div>
        <div class="footer-row"><p class="hint">Errors are highlighted above as you type.</p><button type="button" id="restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>Restart test</button></div>
        <div class="result" id="result" role="status"><div><strong>Test complete — nicely done.</strong><span id="result-copy"></span></div><button type="button" id="new-test">Try another</button></div>
      </section>
    </main>
    <script>
      const passages = [
        "The best way to predict the future is to create it with patience, curiosity, and a willingness to learn from every small attempt.",
        "A quiet morning, a clear desk, and a single meaningful task can turn an ordinary day into a surprisingly good one.",
        "Great ideas rarely arrive fully formed. They grow through conversations, careful observation, and the courage to begin before feeling ready.",
        "Progress is often hidden in the routine: one page read, one question asked, one thoughtful choice made again and again."
      ];
      const input = document.querySelector('#typing-input'); const passageEl = document.querySelector('#passage'); const timeEl = document.querySelector('#time'); const wpmEl = document.querySelector('#wpm'); const accuracyEl = document.querySelector('#accuracy'); const result = document.querySelector('#result'); const resultCopy = document.querySelector('#result-copy');
      let passage = '', startedAt = null, timer = null, complete = false;
      const formatTime = seconds => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
      const elapsed = () => startedAt ? Math.max(1, Math.floor((Date.now() - startedAt) / 1000)) : 0;
      const metrics = () => { const typed = input.value; const correct = [...typed].filter((char, i) => char === passage[i]).length; const accuracy = typed.length ? Math.round((correct / typed.length) * 100) : 100; const seconds = elapsed(); const wpm = seconds ? Math.round((correct / 5) / (seconds / 60)) : 0; return { correct, accuracy, seconds, wpm }; };
      function renderPassage() { const typed = input.value; passageEl.innerHTML = [...passage].map((char, i) => { let state = i < typed.length ? (typed[i] === char ? 'correct' : 'incorrect') : i === typed.length && !complete ? 'current' : ''; return `<span class="${state}">${char === ' ' ? '&nbsp;' : char}</span>`; }).join(''); }
      function update() { const data = metrics(); timeEl.textContent = formatTime(data.seconds); wpmEl.textContent = `${data.wpm} WPM`; accuracyEl.textContent = `${data.accuracy}%`; renderPassage(); }
      function start() { if (!startedAt) { startedAt = Date.now(); timer = setInterval(update, 500); } }
      function finish() { complete = true; clearInterval(timer); update(); input.disabled = true; const {wpm, accuracy, seconds} = metrics(); resultCopy.textContent = `${wpm} WPM · ${accuracy}% accuracy · ${formatTime(seconds)} total time`; result.classList.add('show'); }
      function reset(focus = false) { const previous = passage; do { passage = passages[Math.floor(Math.random() * passages.length)]; } while (passages.length > 1 && passage === previous); startedAt = null; clearInterval(timer); complete = false; input.value = ''; input.disabled = false; result.classList.remove('show'); document.querySelector('#word-count').textContent = `${passage.split(' ').length} words`; update(); if (focus) input.focus(); }
      input.addEventListener('input', () => { if (complete) return; if (input.value.length) start(); update(); if (input.value === passage) finish(); });
      document.querySelector('#restart').addEventListener('click', () => reset(true)); document.querySelector('#new-test').addEventListener('click', () => reset(true)); reset();
    </script>
  </body>
</html>
