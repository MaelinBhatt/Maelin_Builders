<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#072c29" />
    <title>Maelin's Lorikeet Garden</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');

      :root { color: #f7f0d8; background: #042e2a; font-family: "DM Mono", ui-monospace, monospace; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; overflow-x: hidden; background: #042e2a; }
      .hero { isolation: isolate; min-height: 100vh; display: grid; grid-template-columns: minmax(0, .96fr) minmax(320px, 1.04fr); }
      .copy { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; padding: clamp(2rem, 7vw, 7rem); background: #063d37; overflow: hidden; }
      .copy::before, .copy::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; opacity: .75; filter: blur(2px); }
      .copy::before { width: 34rem; height: 34rem; top: -18rem; left: -18rem; background: #0e7769; }
      .copy::after { width: 20rem; height: 20rem; right: -9rem; bottom: -10rem; background: #d75b2f; }
      .eyebrow { margin: 0 0 1.6rem; color: #ffca51; font-size: .72rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; }
      h1 { max-width: 8ch; margin: 0; color: #fff8e8; font-family: "Playfair Display", Georgia, serif; font-size: clamp(3.7rem, 7.7vw, 7.6rem); font-weight: 600; letter-spacing: -.07em; line-height: .88; }
      h1 em { color: #ffbd3b; font-weight: inherit; }
      .intro { max-width: 35rem; margin: 2.25rem 0 2.3rem; color: #d4e8ce; font-size: clamp(.9rem, 1.35vw, 1.05rem); line-height: 1.8; }
      .celebrate { width: fit-content; border: 0; border-radius: 999px; padding: 1.05rem 1.5rem; color: #073b35; background: #ffca51; box-shadow: 0 8px 0 #d98431; font: inherit; font-size: .78rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
      .celebrate:hover { transform: translateY(-3px); box-shadow: 0 11px 0 #d98431; }
      .celebrate:active { transform: translateY(5px); box-shadow: 0 3px 0 #d98431; }
      .hint { margin: 1.9rem 0 0; color: #a8cbbb; font-size: .66rem; letter-spacing: .08em; }
      .visual { position: relative; min-height: 56vh; overflow: hidden; background: #142d1d; }
      .bird-photo { width: 100%; height: 100%; min-height: 100vh; display: block; object-fit: cover; object-position: 53% center; filter: saturate(1.25) contrast(1.08); }
      .visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #063d37 0%, transparent 23%), linear-gradient(0deg, #062d28bb 0%, transparent 37%); pointer-events: none; }
      .species { position: absolute; z-index: 1; right: clamp(1.5rem, 4vw, 4rem); bottom: clamp(1.5rem, 4vw, 4rem); width: min(20rem, 65%); padding: 1.1rem 1.25rem; border: 1px solid #ffffff4d; border-radius: .35rem; background: #082f2cbb; backdrop-filter: blur(8px); }
      .species strong { display: block; color: #ffcc54; font-size: .67rem; letter-spacing: .14em; text-transform: uppercase; }
      .species span { display: block; margin-top: .5rem; color: #f8f3de; font-family: "Playfair Display", Georgia, serif; font-size: 1.32rem; font-style: italic; }
      #celebration { position: fixed; z-index: 20; inset: 0; overflow: hidden; pointer-events: none; }
      .confetti { position: absolute; top: -3vh; width: 10px; height: 16px; border-radius: 2px; animation: fall var(--duration) cubic-bezier(.19,.72,.35,1) forwards; transform: translate3d(var(--x), 0, 0) rotate(0); }
      .flying-bird { position: absolute; width: 52px; height: 25px; background: currentColor; clip-path: polygon(0 56%, 12% 52%, 26% 4%, 50% 48%, 72% 4%, 88% 52%, 100% 56%, 78% 69%, 50% 60%, 22% 69%); filter: drop-shadow(0 4px 2px #00251b88); animation: fly var(--duration) ease-in forwards; }
      @keyframes fall { 100% { transform: translate3d(calc(var(--x) + var(--drift)), 110vh, 0) rotate(var(--spin)); opacity: 0; } }
      @keyframes fly { 0% { transform: translate(-12vw, var(--y)) scale(var(--scale)) rotate(-6deg); } 45% { transform: translate(47vw, calc(var(--y) - 13vh)) scale(var(--scale)) rotate(5deg); } 100% { transform: translate(112vw, var(--y)) scale(var(--scale)) rotate(-4deg); } }
      @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .copy { min-height: 57vh; padding: 4.5rem 2rem 3rem; } .visual, .bird-photo { min-height: 43vh; height: 43vh; } h1 { max-width: 10ch; } .species { left: 1.5rem; bottom: 1.5rem; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main class="hero">
      <section class="copy" aria-labelledby="page-title">
        <p class="eyebrow">Welcome to Maelin's bird garden</p>
        <h1 id="page-title">A little more <em>color</em> in the sky.</h1>
        <p class="intro">Meet the rainbow lorikeet — a small, bright flash of blue, green, and sunset orange. Press the button to send the flock into a joyful flight.</p>
        <button class="celebrate" id="celebrate" type="button">Let the birds fly</button>
        <p class="hint">A tiny celebration, just for you ✦</p>
      </section>
      <section class="visual" aria-label="Rainbow lorikeet portrait">
        <img class="bird-photo" src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?auto=format&amp;fit=crop&amp;w=1400&amp;q=90" alt="A colorful rainbow lorikeet with a blue head, green neck, and orange breast" />
        <div class="species"><strong>Today's bright visitor</strong><span>Rainbow lorikeet</span></div>
      </section>
    </main>
    <div id="celebration" aria-hidden="true"></div>
    <script>
      const button = document.querySelector('#celebrate');
      const celebration = document.querySelector('#celebration');
      const colors = ['#ffca51', '#fb7056', '#31b99a', '#4d83f0', '#f6ebcf'];
      function makePiece(className, properties) {
        const piece = document.createElement('i');
        piece.className = className;
        Object.entries(properties).forEach(([key, value]) => piece.style.setProperty(key, value));
        celebration.append(piece);
        piece.addEventListener('animationend', () => piece.remove());
      }
      button.addEventListener('click', () => {
        button.textContent = 'The flock is flying!';
        window.setTimeout(() => { button.textContent = 'Let the birds fly'; }, 1600);
        for (let i = 0; i < 95; i++) {
          makePiece('confetti', { '--x': `${Math.random() * 100}vw`, '--drift': `${-15 + Math.random() * 30}vw`, '--spin': `${360 + Math.random() * 1080}deg`, '--duration': `${1.8 + Math.random() * 1.7}s`, background: colors[i % colors.length] });
        }
        for (let i = 0; i < 8; i++) {
          makePiece('flying-bird', { '--y': `${8 + Math.random() * 72}vh`, '--scale': `${.45 + Math.random() * .8}`, '--duration': `${2.4 + Math.random() * 1.7}s`, color: colors[i % colors.length], animationDelay: `${i * .12}s` });
        }
      });
    </script>
  </body>
</html>
