<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172820" />
    <title>Hello, Maelin!!</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fascinate+Inline&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

      :root { color: #fffbed; background: #172820; font-family: "DM Mono", ui-monospace, monospace; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; overflow: hidden; background: #172820; }
      .garden { position: relative; min-height: 100vh; display: grid; place-items: center; isolation: isolate; overflow: hidden; background: linear-gradient(#06140b66, #06140b66), url("https://wallup.net/wp-content/uploads/2019/09/24880-animals-birds-parrots-nature-wildlife-flight-fly-wings-feathers-colors-beak-eyes-stare-look-tropical-jungles-trees-forest-1.jpg"); background-position: center; background-size: cover; }
      .garden::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at center, transparent 15%, #05150bbd 100%); }
      .center { position: relative; display: grid; justify-items: center; gap: 2.4rem; padding: 2rem; text-align: center; }
      h1 { margin: 0; color: #fffbed; font-family: "Playfair Display", Georgia, serif; font-size: clamp(4rem, 11vw, 10.5rem); font-style: italic; line-height: .86; letter-spacing: -.075em; text-shadow: 0 6px 0 #173928, 0 13px 20px #07150da8; transition: font-family .35s ease, letter-spacing .35s ease, color .35s ease, transform .35s ease; }
      h1.dramatic { color: #ffcf47; font-family: "Fascinate Inline", "Playfair Display", Georgia, serif; font-style: normal; letter-spacing: .015em; transform: rotate(-2deg) scale(1.04); text-shadow: 0 5px 0 #d85238, 0 12px 0 #642524, 0 18px 26px #07150dc9; }
      .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
      button { border: 2px solid #fff4cf; border-radius: 999px; padding: .92rem 1.15rem; color: #fffbed; background: #173928e8; box-shadow: 0 5px 0 #0c2218; font: 500 .73rem/1 "DM Mono", ui-monospace, monospace; letter-spacing: .05em; cursor: pointer; transition: transform .15s ease, background .15s ease, box-shadow .15s ease; }
      button:hover { background: #f2ba39; color: #183224; transform: translateY(-3px); box-shadow: 0 8px 0 #0c2218; }
      button:active { transform: translateY(3px); box-shadow: 0 2px 0 #0c2218; }
      #effects { position: fixed; z-index: 5; inset: 0; overflow: hidden; pointer-events: none; }
      .confetti { position: absolute; top: -3vh; width: 11px; height: 18px; border-radius: 2px; animation: fall var(--duration) cubic-bezier(.16,.66,.36,1) forwards; }
      .flyer { position: absolute; top: 0; left: 0; width: 112px; height: 82px; overflow: hidden; border: 3px solid #f5de93; border-radius: 52% 48% 50% 45%; box-shadow: 0 6px 13px #07150d9c; animation: fly var(--duration) ease-in forwards; }
      .flyer img { width: 100%; height: 100%; object-fit: cover; object-position: 49% 46%; filter: saturate(1.2) contrast(1.1); }
      @keyframes fall { 0% { transform: translate3d(var(--x), -5vh, 0) rotate(0deg); } 100% { transform: translate3d(calc(var(--x) + var(--drift)), 110vh, 0) rotate(var(--spin)); opacity: 0; } }
      @keyframes fly { 0% { transform: translate(-16vw, var(--y)) scale(var(--scale)) rotate(-10deg); } 48% { transform: translate(48vw, calc(var(--y) - 17vh)) scale(var(--scale)) rotate(8deg); } 100% { transform: translate(112vw, var(--y)) scale(var(--scale)) rotate(-6deg); } }
      @media (max-width: 650px) { .garden { background-position: 53% center; } .center { gap: 1.7rem; } .buttons { max-width: 19rem; } button { padding: .82rem .85rem; font-size: .63rem; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main class="garden">
      <div class="center">
        <h1 id="heading">Hello, Maelin!!</h1>
        <div class="buttons">
          <button id="confetti-button" type="button">Make confetti</button>
          <button id="birds-button" type="button">Make quaker parrots fly</button>
          <button id="font-button" type="button">Make the text dramatic</button>
        </div>
      </div>
    </main>
    <div id="effects" aria-hidden="true"></div>
    <script>
      const effects = document.querySelector('#effects');
      const heading = document.querySelector('#heading');
      const parrotSource = 'https://images.unsplash.com/photo-1552728089-57bdde30beb3?auto=format&fit=crop&w=900&q=90';
      const colors = ['#ffca47', '#f36c48', '#79b961', '#5c8cea', '#fff4cf'];
      function addEffect(className, properties, image) {
        const element = document.createElement('i');
        element.className = className;
        Object.entries(properties).forEach(([key, value]) => element.style.setProperty(key, value));
        if (image) { const img = document.createElement('img'); img.src = image; img.alt = ''; element.append(img); }
        effects.append(element);
        element.addEventListener('animationend', () => element.remove());
      }
      document.querySelector('#confetti-button').addEventListener('click', () => {
        for (let i = 0; i < 110; i++) addEffect('confetti', { '--x': `${Math.random() * 100}vw`, '--drift': `${-18 + Math.random() * 36}vw`, '--spin': `${360 + Math.random() * 1080}deg`, '--duration': `${1.8 + Math.random() * 1.8}s`, background: colors[i % colors.length] });
      });
      document.querySelector('#birds-button').addEventListener('click', () => {
        for (let i = 0; i < 9; i++) addEffect('flyer', { '--y': `${6 + Math.random() * 75}vh`, '--scale': `${.42 + Math.random() * .65}`, '--duration': `${2.3 + Math.random() * 1.7}s`, animationDelay: `${i * .12}s` }, parrotSource);
      });
      document.querySelector('#font-button').addEventListener('click', () => heading.classList.toggle('dramatic'));
    </script>
  </body>
</html>
